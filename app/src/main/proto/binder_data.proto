syntax = "proto3";

option java_package = "com.example.okonomi";
option java_outer_classname = "BinderDataProto";

message Page{
    string id = 1;
    int32 order_index = 2;
    string layout_type = 3;
    string text_content = 4;
    repeated string image_paths = 5;
    }

message Binder{
    string id = 1;
    string title = 2;
    int64 created_at = 3;
    int64 updated_at = 4;
    string locked_by = 5;
    int64 lock_timestamp = 6;
    repeated string image_paths = 7;
    }
